<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Menturo Loader</title>
  <link rel="stylesheet" href="loader.css">

</head>

<body>

  <div class="main-content">
    <h1>WELCOME TO MENTURO</h1>
    <p>India's Smart Learning Platform</p>
  </div>

  <div class="loader-screen hide-loader">

    <div class="text-loader">
      <div class="letter">M</div>
      <div class="letter">E</div>
      <div class="letter">N</div>
      <div class="letter">T</div>
      <div class="letter">U</div>
      <div class="letter">R</div>
      <div class="letter">O</div>
    </div>

    <div class="logo-wrapper">
      <div class="logo-box">
        <div class="flash"></div>
        <img src="M3.png" alt="Menturo Logo" class="logo-img">
      </div>

      <div class="shadow"></div>

      <div class="loading">LOADING</div>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="green-expand"></div>

    <div class="final-screen">
      <img src="M3.png" alt="Menturo Logo">
      <h1>MENTURO</h1>
      <p>LEARN • PRACTICE • SUCCESS</p>
    </div>

  </div>

</body>

</html>
